<!doctype html><html><head><meta charset="utf-8"><title>Synthetic 1688 editor regression</title>
<style>pre.edit{min-height:80px;min-width:300px;border:1px solid;white-space:pre-line} .disabled{opacity:.6}</style></head><body>
<!-- Sanitized pre.edit hook: the 185364703 capture contains a trailing &nbsp;.
     Collapsing whitespace reproduces Chromium's native space-to-NBSP editing.
     Framework behavior is synthetic; no captured conversations or scripts. -->
<section data-chat-root><pre class="edit" contenteditable="true"></pre><button class="disabled" aria-disabled="true">发送</button><div id="history"></div></section>
<script>
window.sendClicks=0;window.nativeEdits=0;window.ignoreSend=false;window.model='';window.mouseClicks=0;window.clickedEditor=false;
const editor=document.querySelector('pre.edit'),send=document.querySelector('button');
editor.addEventListener('click',event=>{if(event.isTrusted){mouseClicks++;clickedEditor=true;}});
// A DOM-only draft must not update the framework model. Native editing emits
// a trusted input event, including when invoked via execCommand('insertText').
editor.addEventListener('input',event=>{if(event.isTrusted){nativeEdits++;model=editor.innerText;}});
editor.addEventListener('keyup',event=>{
  // Reproduce the remaining bug: synthetic keyup/execCommand alone cannot
  // activate Send. The user reports that a real space key activates it.
  if(!clickedEditor || !event.isTrusted || !['Space','Backspace'].includes(event.code))return;
  window.lastTrustedKey=event.code;
  const enabled=!!model.trim();send.setAttribute('aria-disabled',String(!enabled));send.classList.toggle('disabled',!enabled);
});
send.onclick=()=>{
  sendClicks++;
  if(ignoreSend || send.getAttribute('aria-disabled')==='true')return;
  const row=document.createElement('p');row.className='outgoing';row.textContent=model;document.querySelector('#history').append(row);
  editor.textContent='';model='';clickedEditor=false;send.setAttribute('aria-disabled','true');
};
</script></body></html>
